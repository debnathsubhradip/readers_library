<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Display</title>
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/main.css">
    <!-- CSS only -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-eOJMYsd53ii+scO/bJGFsiCZc+5NDVN2yr8+0RDqr0Ql0h+rP48ckxlpbzKgwra6" crossorigin="anonymous">
</head>
<body>
    <nav class="navbar navbar-expand-sm navbar-dark bg-dark">
        <div class="container-fluid">
            <a href="index.html" class="navbar-brand">Readers' Library</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarMenu">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a href="casualread.html" class="nav-link">Casual Read</a>
                    </li>
                    <li class="nav-item">
                        <a href="engineerread.html" class="nav-link">Engineer Read</a>
                    </li>
                    <li class="nav-item">
                        <a href="htmlread.html" class="nav-link">HTML Read</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container-fluid py-3 px-3">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2><i class="bi bi-book me-2"></i>Book Viewer</h2>
            <div class="btn-group">
                <button id="fullscreenBtn" class="btn btn-outline-primary" onclick="toggleFullscreen()">
                    <i class="bi bi-arrows-fullscreen"></i> Fullscreen
                </button>
                <button id="exitFullscreenBtn" class="btn btn-outline-danger" onclick="toggleFullscreen()" style="display:none;">
                    <i class="bi bi-x-lg"></i> Exit
                </button>
                <a id="downloadBtn" class="btn btn-outline-success" href="#" target="_blank">
                    <i class="bi bi-download"></i> Download
                </a>
                <button onclick="history.back()" class="btn btn-outline-secondary">
                    <i class="bi bi-arrow-left"></i> Back
                </button>
            </div>
        </div>

        <div id="adobe-dc-view"></div>
    </main>

    <script>
        // Fullscreen toggle function
        function toggleFullscreen() {
            document.body.classList.toggle('fullscreen');
        }
    </script>

    <footer class="bg-dark text-white py-3 mt-auto">
        <div class="container text-center">
            <p class="mb-0">Readers' Library &copy; 2024</p>
        </div>
    </footer>

    <script src="https://documentcloud.adobe.com/view-sdk/main.js"></script>
    <script src="javascript/bookdisplay.js"></script>
</body>
</html>
