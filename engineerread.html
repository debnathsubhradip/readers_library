<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Engineer Read</title>
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/main.css">
    <!-- CSS only -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-eOJMYsd53ii+scO/bJGFsiCZc+5NDVN2yr8+0RDqr0Ql0h+rP48ckxlpbzKgwra6" crossorigin="anonymous">
</head>
<body>
    <nav class="navbar navbar-expand-sm navbar-dark bg-dark">
        <div class="container-fluid">
            <a href="index.html" class="navbar-brand">Readers' Library</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarMenu">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a href="casualread.html" class="nav-link">Casual Read</a>
                    </li>
                    <li class="nav-item">
                        <a href="engineerread.html" class="nav-link active">Engineer Read</a>
                    </li>
                    <li class="nav-item">
                        <a href="htmlread.html" class="nav-link">HTML Read</a>
                    </li>
                </ul>
                <form class="d-flex" onsubmit="event.preventDefault(); search();">
                    <input class="form-control me-2" type="search" id="searchlabel" oninput="search()" placeholder="Search books..." aria-label="Search">
                    <button class="btn btn-outline-light" type="button" onclick="search()">Search</button>
                </form>
            </div>
        </div>
    </nav>

    <main class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="mb-1">Welcome to Readers' Book Library</h1>
                <h2 class="text-muted h4">Engineer Read Repository</h2>
            </div>
            <div>
                <a href="index.html" class="btn btn-outline-secondary me-2">
                    <i class="bi bi-house"></i> Home
                </a>
                <button class="btn btn-outline-primary" onclick="loadresource()">
                    <i class="bi bi-arrow-clockwise"></i> Reload Resources
                </button>
            </div>
        </div>

        <div id="displaylist">
            <!-- Book cards will be loaded here -->
        </div>
    </main>

    <footer class="bg-dark text-white py-3 mt-auto">
        <div class="container text-center">
            <p class="mb-0">Readers' Library &copy; 2024</p>
        </div>
    </footer>

    <!-- JavaScript Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta3/dist/js/bootstrap.bundle.min.js" integrity="sha384-JEW9xMcG8R+pH31jmWH6WWP0WintQrMb4s7ZOdauHnUtxwoG2vI5DkLtS3qm9Ekf" crossorigin="anonymous"></script>
    <script src="javascript/main.js"></script>
    <script src="javascript/engineerread.js"></script>
</body>
</html>
